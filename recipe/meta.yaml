{% set name = "echo" %}
{% set version = "0.17.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d4cbe0462981b68a98d14227d976c76c3752c6065c298227d1bf8c36d9b84672
  patches:
    - patches/0001-fix-license-in-pyproject.toml.patch

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
    - setuptools-scm
  run:
    - python
    - numpy
  run_constrained:
    - pyqt >=5.14  # from `qt` extra; remaining extras are unbounded or dev-only

test:
  imports:
    - echo
    - echo.core
    - echo.selection
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv --pyargs echo.tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/glue-viz/echo
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Callback Properties in Python
  description: Echo is a small library for attaching callback functions to property state changes.
  dev_url: https://github.com/glue-viz/echo
  doc_url: https://echo.readthedocs.io

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
